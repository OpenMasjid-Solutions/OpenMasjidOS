name: Build & Push Docker Image

on:
  push:
    # master = Stable (publishes :latest), dev = Development (publishes :dev via
    # type=ref,event=branch). Without dev here the Development channel would have no
    # image to pull and the channel toggle would be inert.
    branches: [master, dev]
    tags: ["v*"]
  pull_request:
    branches: [master, dev]

# One run per branch. Two pushes in quick succession both push the SAME tags
# (including `:latest`), and the multi-arch arm64 build runs under QEMU, so an
# older run can easily still be going when a newer one finishes — whichever lands
# LAST wins, silently republishing `:latest` from the older commit. Cancel the
# superseded run instead. (Tag pushes have their own ref, so a release build is
# never cancelled by a branch push.)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/openmasjid-core

jobs:
  # Typecheck + tests. This is the gate the repo was missing: `npm run build` is
  # vite + esbuild and typechecks NOTHING, so before this job the only thing
  # standing between a type error and a published image was someone remembering
  # to run `npm run lint` locally. That is how the @fastify/static v10 bump — which
  # changed the `setHeaders` callback's first argument, making every dashboard file
  # 500 — got within one command of shipping. `build` depends on this job.
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        # Node 20 to match the runtime image (node:20-alpine), so we test on the
        # version we actually ship rather than whatever the runner defaults to.
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck (lint)
        run: npm run lint
      - name: Tests
        run: npm test

  # Supply-chain signal: fail on known high/critical advisories.
  #
  # Audits the lockfile AS COMMITTED. The previous version ran
  # `npm install --package-lock-only` first, which re-resolves every semver range
  # against the registry — so it graded a tree that may not be the one the image
  # builds from via `npm ci`. They happen to agree today, but the divergence can
  # go either way: a clean audit while the shipped pin is vulnerable, or a red
  # audit for a version we never install.
  #
  # Deliberately NOT a dependency of `build`: an advisory published overnight in a
  # transitive dep is not a reason the project cannot ship a fix. It still turns
  # the run red, which is the signal we want.
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Audit the committed lockfile
        run: npm audit --audit-level=high --package-lock-only

  # Build each architecture ON a runner of that architecture. NO QEMU.
  #
  # Emulated arm64 did not merely make builds slow — it HUNG. On 2026-08-11 the arm64 leg
  # sat on `RUN npm ci` for 1h47m emitting not one line, while every amd64 step finished
  # inside a minute; it ended only because it was cancelled. That had been latent for
  # weeks: the layer cache meant `npm ci` rarely re-ran, and the first dependency change
  # since exposed it. GitHub provides native arm64 runners free for public repositories,
  # so the fix is to remove the emulator rather than tune around it.
  #
  # Each leg pushes an UNTAGGED image by digest; `merge` then assembles one manifest list
  # and applies the tags. A useful side-effect: tags are written in exactly one job, which
  # is the "one writer per tag" property the tag rules depend on.
  build:
    # No image is published unless the tree typechecks and the tests pass.
    needs: [checks]
    permissions:
      contents: read
      packages: write
    # A deadline, because the lesson of that hang is that silence reads exactly like
    # progress. A native build takes ~5 minutes; anything near this limit is broken, and
    # failing is far more useful than holding a runner for GitHub's 6-hour default.
    timeout-minutes: 30
    strategy:
      # One architecture failing must not hide the other's result.
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Labels only in this job. The TAGS are applied once, by `merge`.
      - name: Extract labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # A pull request publishes nothing — it only proves the Dockerfile still builds.
      - name: Build (pull request — nothing is published)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.platform }}

      - name: Build and push by digest
        id: build
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          # Scoped PER PLATFORM. A single shared scope would have the two runners
          # overwriting each other's cache on every run, which is how you get a build
          # that is mysteriously cold half the time.
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      # Hand the digest to `merge` as an empty file named after it, so the merge step
      # needs no knowledge of the matrix.
      - name: Export the digest
        if: github.event_name != 'pull_request'
        run: |
          digest='${{ steps.build.outputs.digest }}'
          # Fail here rather than let an empty digest surface as a baffling malformed
          # `imagetools create` two jobs later.
          test -n "$digest" || { echo "::error::the build produced no digest"; exit 1; }
          mkdir -p /tmp/digests
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload the digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          # Artifact names must be unique per matrix leg on upload-artifact v4.
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Assemble the per-architecture images into ONE manifest list and tag it. This is the
  # only job that writes tags, which is what keeps "one writer per tag" true.
  merge:
    if: github.event_name != 'pull_request'
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the per-architecture digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The VERSION file is the single source of truth (CLAUDE.md §18), and on the dev
      # branch it holds a prerelease (`0.50.2-dev.1`). Publishing a tag named for it is
      # what makes the Development channel updatable: the platform pulls the EXACT
      # version its update check just found, because `:dev` is a moving alias that can
      # still point at the previous build while a new one is publishing — pulling that
      # installs different bytes from the version the admin was told about.
      - name: Read VERSION
        id: ver
        run: echo "version=$(tr -d ' \t\r\n' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # `type=raw` with the VERSION file covers the dev branch, where `type=semver`
          # does nothing (it only fires on a `v*` tag ref) and so nothing else would
          # publish a per-build tag.
          #
          # Scoped to dev DELIBERATELY. A release's `:X.Y.Z` must come only from its
          # immutable `v*` tag; enabling this for every branch let a master push
          # republish `:0.50.0` on top of what the release tag had already published —
          # same source, but a rebuilt image is not byte-identical, so a "pinned"
          # release tag quietly started moving.
          #
          # `:latest` comes from ONE place: a non-prerelease `v*` tag. `is_default_branch`
          # looked like it meant that, but it is ALSO true for a tag push — so `:latest`
          # was written twice per release, by the master-branch build and by the tag
          # build, two independent runs of the same commit. Whichever finished last won,
          # so `:latest` routinely held different bytes from `:X.Y.Z` (v0.50.1: latest
          # 5eaf997 vs 0.50.1 23696bb) and Stable masjids ran an image the release tag
          # did not name. Excluding prereleases keeps a `v*-dev.*` tag, should one ever
          # be pushed, from dragging every Stable box onto a Development build.
          tags: |
            type=ref,event=branch
            type=raw,value=${{ steps.ver.outputs.version }},enable=${{ github.ref_name == 'dev' && github.ref_type == 'branch' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}

      - name: Create the manifest list and tag it
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      # Prove BOTH architectures are in what was actually published. A manifest list
      # missing arm64 installs perfectly on a mini-PC and fails on every Raspberry Pi —
      # the exact class of failure that must not be discovered by a masjid.
      - name: Verify both architectures were published
        run: |
          ref='${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}'
          docker buildx imagetools inspect "$ref"
          docker buildx imagetools inspect --raw "$ref" > /tmp/index.json
          for want in amd64 arm64; do
            jq -e --arg a "$want" \
              '[.manifests[]? | select(.platform.os == "linux") | .platform.architecture] | index($a)' \
              /tmp/index.json >/dev/null \
              || { echo "::error::$ref is missing linux/$want"; exit 1; }
          done
          echo "Published $ref for linux/amd64 and linux/arm64."
